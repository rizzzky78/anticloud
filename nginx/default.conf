# =============================================================================
# anticloud-production — nginx HTTPS reverse proxy
#
# Terminates TLS on :443 (published to host as :3240) and proxies to the
# Next.js standalone server running on the private docker network.
#
# Intranet deployment with a SELF-SIGNED certificate — browsers will show a
# trust warning the first time (expected; accept the exception, or distribute
# the CA/cert to clients via group policy).
# =============================================================================

# Upstream = the app container on the shared docker network (service name).
upstream anticloud_app {
    server anticloud-production:3000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTPS server
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name _;

    # Self-signed certificate (generated by ./nginx/generate-cert.sh)
    ssl_certificate     /etc/nginx/certs/anticloud.crt;
    ssl_certificate_key /etc/nginx/certs/anticloud.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Allow large certificate-document uploads (MinIO max is 10 MB; allow margin).
    client_max_body_size 25m;

    # Long timeouts for streaming downloads / report generation.
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location / {
        proxy_pass http://anticloud_app;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Critical for Better Auth + Next.js to build correct absolute URLs
        # behind the TLS-terminating proxy.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_buffering off;
    }
}

# ---------------------------------------------------------------------------
# Optional: redirect plain HTTP (if a second host port maps to :80) to HTTPS.
# Not published by default in docker-compose.yml — uncomment the port mapping
# there to use this.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}