# ──────────────────────────────────────────────────────────────────────────────
# anticloud — self-hosted deployment (Ubuntu 24+, Bun runtime)
#
# Postgres, Dragonfly and MinIO already run on the host as separate containers,
# so they are NOT defined here. This stack only builds and runs the two anticloud
# processes and points them at the existing services via `.env.docker`.
#
#   app    → HTTP on 127.0.0.1:3070  (nginx terminates TLS in front of it)
#   worker → no ports; consumes the Redis/Dragonfly job queue
#
# Connecting to the existing services — pick ONE in `.env.docker`:
#   A) host-gateway (default): the existing containers publish their ports on the
#      host (5432 / 6379 / 9000). Reach them at `host.docker.internal` via the
#      `extra_hosts` mapping below. Simplest; no shared network required.
#   B) shared network: uncomment the `networks` block and attach to the existing
#      Docker network so you can address services by container name.
# ──────────────────────────────────────────────────────────────────────────────

x-anticloud-common: &anticloud-common
  build:
    context: .
    dockerfile: Dockerfile
  image: anticloud:latest
  restart: unless-stopped
  env_file:
    - .env.docker
  init: true
  # Option A — reach host-published services as `host.docker.internal`.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  # Option B — uncomment to join the existing services' network instead.
  # networks:
  #   - shared

services:
  app:
    <<: *anticloud-common
    container_name: anticloud-app
    # Published on the host LOOPBACK at 3071 (container still listens on 3070).
    # nginx owns the public-facing 3070 and proxies here, so the app port must
    # not collide with it. Never expose this publicly — TLS is nginx's job.
    ports:
      - "127.0.0.1:3071:3070"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3070/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    <<: *anticloud-common
    container_name: anticloud-worker
    command: ["bun", "run", "worker.ts"]
    # The worker reaches the DB/Redis/MinIO directly; it serves no HTTP and the
    # app does not depend on it to boot, so no port and no depends_on.

# Option B — declare the existing external network here, then enable the
# `networks` key in the common anchor above. Replace the name with your actual
# network (find it with: `docker network ls`).
# networks:
#   shared:
#     external: true
#     name: your-existing-network
