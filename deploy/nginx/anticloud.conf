# ──────────────────────────────────────────────────────────────────────────────
# anticloud — nginx reverse proxy (intranet, HTTPS on :3070 → app on :3071)
#
# End users reach the app at  https://10.54.204.59:3070  on the intranet.
# nginx terminates TLS on port 3070 and proxies to the app container, which is
# published on the host loopback at 127.0.0.1:3071 (see docker-compose.yml).
#
# This adds its OWN server block on a dedicated port and does not touch your
# existing nginx sites (which keep using 80/443). No port conflict.
#
# Install:
#   sudo cp deploy/nginx/anticloud.conf /etc/nginx/sites-available/anticloud.conf
#   sudo ln -s /etc/nginx/sites-available/anticloud.conf /etc/nginx/sites-enabled/
#   # generate the TLS cert first (see deploy/README.md → "TLS for an intranet IP")
#   sudo nginx -t && sudo systemctl reload nginx
# ──────────────────────────────────────────────────────────────────────────────

upstream anticloud_app {
    server 127.0.0.1:3071;
    keepalive 32;
}

server {
    # Listen for HTTPS directly on 3070 (the port users hit). IPv4 only — bind to
    # the intranet interface explicitly if you don't want it on all interfaces:
    #   listen 10.54.204.59:3070 ssl;
    listen 3070 ssl;
    http2 on;

    server_name 10.54.204.59;

    # ── TLS (self-signed / internal CA — Let's Encrypt can't issue for an IP) ──
    ssl_certificate     /etc/nginx/ssl/anticloud.crt;
    ssl_certificate_key /etc/nginx/ssl/anticloud.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Uploads / downloads ──────────────────────────────────────────────────
    # File host: don't let nginx cap upload size. Set a ceiling (e.g. 5g) if you
    # want a hard limit instead of unlimited.
    client_max_body_size 0;

    # Stream bodies straight through; don't buffer large up/downloads.
    proxy_request_buffering off;
    proxy_buffering off;

    # Generous timeouts for big transfers / long-running stream responses.
    proxy_connect_timeout 60s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;

    location / {
        proxy_pass http://anticloud_app;
        proxy_http_version 1.1;

        # Preserve original host/scheme so Better-Auth & APP_URL stay correct.
        # $http_host keeps the "IP:3070" the user typed (incl. the port).
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        # WebSocket upgrade passthrough.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
